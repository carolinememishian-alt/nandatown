# Marketplace under message loss.
#
# Exactly the same as `marketplace.yaml` apart from one setting:
# `failures.message_drop`. That's the only thing the experiment changes.
# The writeup is in
# docs/hackathon/submissions/marketplace-drop-amplification/README.md
#
# Run the full sweep with:
#   python docs/hackathon/submissions/marketplace-drop-amplification/sweep.py
#
# Or a single point:
#   nest run scenarios/marketplace_drop_sweep.yaml --seed 1
name: marketplace_drop_sweep
description: "50 buyers and 50 sellers trading under a lossy network."

tier: 1
seed: 42

agents:
  count: 100
  brain: state-machine
  roles:
    - name: buyer
      count: 50
    - name: seller
      count: 50

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: marketplace
  config:
    catalog_size: 200
    rounds: 10

failures:
  # This is the one setting the experiment changes. The stock
  # marketplace.yaml ships 0.05. Swept across 0.00 / 0.05 / 0.10 / 0.20,
  # five seeds each.
  message_drop: 0.05

duration: "ticks: 10000"

metrics:
  # `mean_latency` is left out on purpose. The in_memory transport delivers
  # at time = now, so the clock never advances and latency always reads 0.0
  # (see "Determinism & what the clock does" in the repo README). Message
  # counts are the signal that actually means something here.
  - success_rate
  - message_count

output:
  trace: ./traces/marketplace_drop_sweep.jsonl
