name: bazaaro_eviction
description: Same forged-card attack as registry_eviction, with Bazaaro as the registry. A rival publishes a fake card under the honest seller's name; Bazaaro should refuse it, keep the honest listing, and the honest seller should still get paid.
seed: 42
layers:
  registry: bazaaro.v1
validator: registry_eviction
plugin_files: [bazaaro_registry.py]
agents:
  - name: seller-honest
    role: seller
    config: {sku: widget, ask_cents: 1995, floor_cents: 1700, stock: 10, balance_cents: 0}
  - name: seller-rival
    role: rival_forger
    config: {sku: widget, ask_cents: 2100, floor_cents: 1850, stock: 10, balance_cents: 0, victim: seller-honest, forge_at: 0.1}
  - name: buyer-1
    role: buyer
    config: {sku: widget, quantity: 2, cap_cents: 1900, balance_cents: 10000, rounds: 1}
max_time: 60
